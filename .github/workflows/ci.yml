name: Shell and mock tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check Shell syntax
        run: |
          for script in *.sh; do
            bash -n "$script"
          done
      - name: Run isolated tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
